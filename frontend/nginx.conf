# nginx dentro del contenedor del frontend.
# - Sirve los archivos compilados de React.
# - Reenvía /api/... al contenedor del backend, así el navegador habla con un
#   solo origen (sin CORS) y el backend no necesita publicar ningún puerto.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de React (por ejemplo /encuesta) devuelven index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
