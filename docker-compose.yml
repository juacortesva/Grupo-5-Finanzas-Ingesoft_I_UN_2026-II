# PostgreSQL para desarrollo LOCAL (ADR-0002, Fase 0).
# En la VM del curso se usa la base de datos provista por el profesor; este
# archivo no es necesario allí.
services:
  postgres:
    image: postgres:16-alpine
    container_name: asesor-financiero-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-asesor_financiero_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
